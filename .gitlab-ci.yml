stages:
    - build

default:
    image: docker:26
    services:
        - docker:26-dind
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ── Preview ────────────────────────────────────────────────────────────────────
build:preview:
    stage: build
    script:
        - |
            docker build \
              --build-arg NEXT_PUBLIC_API_URL="$PREVIEW_API_URL" \
              --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
              --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
              --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
              --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" \
              --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
              --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$NEXT_PUBLIC_FIREBASE_APP_ID" \
              -t "$CI_REGISTRY_IMAGE:preview" \
              .
        - docker push "$CI_REGISTRY_IMAGE:preview"
    rules:
        - if: $CI_COMMIT_BRANCH == "main_preview"

# ── Production ─────────────────────────────────────────────────────────────────
build:production:
    stage: build
    script:
        - |
            docker build \
              --build-arg NEXT_PUBLIC_API_URL="$PROD_API_URL" \
              --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_PROD_FIREBASE_API_KEY" \
              --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_PROD_FIREBASE_AUTH_DOMAIN" \
              --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_PROD_FIREBASE_PROJECT_ID" \
              --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$NEXT_PUBLIC_PROD_FIREBASE_STORAGE_BUCKET" \
              --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$NEXT_PUBLIC_PROD_FIREBASE_MESSAGING_SENDER_ID" \
              --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$NEXT_PUBLIC_PROD_FIREBASE_APP_ID" \
              -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" \
              -t "$CI_REGISTRY_IMAGE:stable" \
              .
        - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        - docker push "$CI_REGISTRY_IMAGE:stable"
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
